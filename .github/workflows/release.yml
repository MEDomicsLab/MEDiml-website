name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write

jobs:
  release:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} -m "chore(release): bump version to %s"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin main --follow-tags
          gh release create "${{ steps.version.outputs.tag }}" --generate-notes
